<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="form-container">

        <h1>Reset Password</h1>

        <p>
            Enter your reset token and choose a new password.
        </p>

        <form id="reset-password-form">

            <input type="hidden" id="token" name="token">

            <label for="password">
                New Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="password" name="password" placeholder="Enter your new password" required>

                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>


            <label for="confirm-password">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="confirm-password" name="confirm-password"
                    placeholder="Confirm your new password" required>

                <button type="button" id="toggle-confirm-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>

            <button type="submit" class="customer-btn">
                Reset Password
            </button>

        </form>

        <p class="form-footer">

            Remember your password?

            <a href="login.html">
                Back to Login
            </a>

        </p>

    </main>

    <script src="js/reset-password.js"></script>

</body>

</html>
