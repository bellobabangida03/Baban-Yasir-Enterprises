<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="form-container admin-login">

        <h1>Admin Login</h1>

        <p>Authorized personnel only.</p>

        <form>

            <label for="email">Admin Email</label>
            <input type="email" id="email" name="email" placeholder="Enter admin email" required>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>
            </div>

            <button type="submit" class="admin-btn">
                Admin Login
            </button>

        </form>

        <p class="form-footer">
            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </p>

        <p class="form-footer">
            <a href="../index.html">
                Back to Home
            </a>
        </p>

    </main>

    <script src="../js/admin-login.js"></script>

</body>

</html>
