<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Forgot Password - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <main class="form-container">

        <h1>Forgot Admin Password?</h1>

        <p>
            Enter your administrator email address
            to receive a password reset link.
        </p>

        <form id="admin-forgot-password-form">

            <label for="email">
                Admin Email
            </label>

            <input type="email" id="email" name="email" placeholder="Enter your admin email" required>

            <button type="submit" class="admin-btn">
                Send Reset Link
            </button>

        </form>

        <p id="forgot-message" class="form-message"></p>

        <p class="form-footer">

            <a href="login.html">
                Back to Admin Login
            </a>

        </p>

    </main>

    <script src="../js/admin-forgot-password.js"></script>

</body>

</html>
