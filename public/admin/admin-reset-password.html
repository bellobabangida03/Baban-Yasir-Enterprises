<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Reset Password - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- ========================================
         ADMIN RESET PASSWORD
         ======================================== -->

    <main class="form-container">

        <h1>Reset Admin Password</h1>

        <p>
            Create a new password for your
            administrator account.
        </p>

        <form id="reset-password-form">

            <label for="password">
                New Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="password" name="password" placeholder="Enter new password" required>

                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>

            <label for="confirm-password">
                Confirm New Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password"
                    required>

                <button type="button" id="toggle-confirm-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>

            <button type="submit" class="admin-btn">
                Reset Password
            </button>

        </form>

        <p id="reset-message" class="form-message"></p>

        <p class="form-footer">

            <a href="login.html">
                Back to Admin Login
            </a>

        </p>

    </main>

    <script src="../js/admin-reset-password.js"></script>

</body>

</html>
