<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="form-container">

        <h1>Create Customer Account</h1>

        <p>Register to view our latest building-material prices.</p>

        <form>

            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number (11 digits)"
                inputmode="numeric" pattern="[0-9]{11}" required>

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="password" name="password" placeholder="Create a password" required>

                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>


            <label for="confirm-password">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    required>

                <button type="button" id="toggle-confirm-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>

            <button type="submit" class="customer-btn">
                Create Account
            </button>

        </form>

        <p class="form-footer">
            Already have an account?
            <a href="login.html">Customer Login</a>
        </p>

    </main>

    <script src="js/register.js"></script>

</body>

</html>
