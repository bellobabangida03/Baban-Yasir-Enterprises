<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - BABAN YASIR ENTERPRISES</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="form-container">

        <h1>Customer Login</h1>

        <p>Login to view our latest building-material prices.</p>

        <form>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="password">Password</label>

            <div class="password-wrapper">

                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                    👁
                </button>

            </div>

            <button type="submit" class="customer-btn">
                Login
            </button>

        </form>

        <p class="form-footer">
            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </p>

        <p class="form-footer">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
